
name: CI - AI SQL Query Generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Create CI environment file
        run: |
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_USER=app_user" >> .env
          echo "DB_PASSWORD=ci_app_password" >> .env
          echo "DB_NAME=temp" >> .env
          echo "MYSQL_ROOT_PASSWORD=ci_root_password" >> .env
          echo "GEMINI_API_KEY=ci_placeholder_key" >> .env

          
      - name: Run automated tests
        run: python -m pytest tests/ -v


      - name: Validate Docker Compose
        run: docker compose config -q
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          DB_PASSWORD: ci_app_password
          GEMINI_API_KEY: ci_placeholder_key

      - name: Build Docker image
        run: docker build -t ai-sql-query-generator:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-sql-query-generator:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-files: '**/pip/_vendor/bom.cdx.json'
